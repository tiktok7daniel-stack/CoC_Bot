name: Clash Royale battle engine (Windows build)

# Builds third_party/clash_royale_env (the C++ battle engine the bot thinks with) for every Python the bot may run
# on, and commits the .pyd files to assets/royale/engine/ on the same branch.
on:
  push:
    paths:
      - "third_party/clash_royale_env/**"
      - ".github/workflows/royale_engine.yml"
      - "src/royale/engine.py"
      - "src/royale/engine_ai.py"
      - "scripts/test_royale_engine.py"
      - "scripts/test_royale_spells.py"
      - "src/royale/brain.py"
      - "src/royale/card_use.py"
      - "src/royale/exit_train.py"
      - "src/ort_gpu.py"
      - "src/royale/eyes.py"
      - "src/royale/strong_eyes.py"
      - "scripts/test_royale_exit.py"
      - "scripts/test_royale_training.py"
      - "scripts/test_royale_vision.py"
      - "src/trt_engine.py"
      - "src/royale/unit_tracker.py"
      - "src/royale/team_color.py"
      - "src/royale/hand_classifier.py"
      - "src/royale/hand_train.py"
      - "src/royale/card_use.py"
      - "src/royale/trainer.py"
      - "scripts/calibrate_team_color.py"
      - "src/royale/frames.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build
        run: |
          python -m pip install --upgrade pip setuptools pybind11
          $env:ENGINE_OUT = "built_engine"
          python third_party/clash_royale_env/build.py
          Copy-Item built_engine/*.pyd assets/royale/engine/ -Force
      - name: Check it loads
        run: python -c "import sys; sys.path.insert(0, 'assets/royale/engine'); import clash_royale_env as c; e = c.ClashRoyaleEnv([15,6,25,40,24,72,33,7],[15,6,25,40,24,72,33,7],3600); e.reset(); print('ok', len(e.get_units()))"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.python }}
          path: built_engine/*.pyd

  checks:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: engine-3.12
          path: assets/royale/engine
      - name: The bot's checks with the real engine
        run: |
          python -m pip install numpy onnxruntime
          python scripts/test_royale_engine.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/test_royale_spells.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: The 6.6 eyes (tracker, team colours, hand model reader, sessions)
        run: |
          python -m pip install scipy opencv-python-headless pillow
          python scripts/test_royale_vision.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: TensorRT for NVIDIA cards (onnxruntime-gpu + TensorRT 10 install into their folder and load)
        run: python -c "import sys, os; sys.path.insert(0, 'src'); import trt_engine as t; ok = t._pip(['onnxruntime-gpu==' + t.PAIRS[0][0], 'tensorrt-cu12-libs==' + t.PAIRS[0][1]]); sys.path.insert(0, str(t.TARGET)); import onnxruntime as o; av = o.get_available_providers(); print(o.__version__, av); print(sorted(os.listdir(t.TARGET / 'tensorrt_libs'))[:12]); sys.exit(0 if ok and 'TensorrtExecutionProvider' in av and any(n.startswith('nvinfer') for n in os.listdir(t.TARGET / 'tensorrt_libs')) else 1)"
      - name: The eyes on the graphics card (DirectML onnxruntime installs and loads)
        run: python -c "import sys; sys.path.insert(0, 'src'); import ort_gpu; ort_gpu._install(); print(open(ort_gpu.LOG, encoding='utf-8').read()[-600:]); sys.exit(0 if ort_gpu.READY.exists() else 1)"

  training-smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: engine-3.12
          path: assets/royale/engine
      - name: Install the training stack (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy psutil gymnasium tensorboard onnx onnxruntime
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train for a few minutes with the account's deck
        run: |
          python scripts/test_royale_training.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Expert Iteration (search -> answers -> training -> gate)
        run: python scripts/test_royale_exit.py

  commit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Commit the builds
        run: |
          mkdir -p assets/royale/engine
          cp -f built/*/*.pyd assets/royale/engine/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/royale/engine/*.pyd
          git diff --cached --quiet && exit 0
          git commit -m "Clash Royale: battle engine built for Windows (Python 3.10-3.13) [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
