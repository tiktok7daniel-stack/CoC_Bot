name: Build ClashFarmer.exe launcher

on:
  push:
    branches: [ccr-d344ab20-onpy71]
    paths:
      - "scripts/launcher/**"
      - ".github/workflows/build_launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the launcher exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --onefile --console --name ClashFarmer --icon src/qt_ui/assets/app_icon.ico scripts/launcher/coc_bot_launcher.py
          copy dist\ClashFarmer.exe dist\CoC_Bot.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClashFarmer-launcher
          path: dist/ClashFarmer.exe
      - name: Publish as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-latest
          name: ClashFarmer.exe (launcher)
          body: |
            ClashFarmer.exe - put it in an empty folder (or the bot folder) and double-click.
            First start downloads the bot and installs everything; every start updates it from GitHub automatically.
          files: |
            dist/ClashFarmer.exe
            dist/CoC_Bot.exe
          make_latest: true
