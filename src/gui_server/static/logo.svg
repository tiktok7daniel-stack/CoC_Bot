<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4c8c"/>
      <stop offset="1" stop-color="#132447"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#d69a1c"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#9fb2d6"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#ffd25a" stroke-opacity=".55" stroke-width="3"/>
  <!-- crossed swords -->
  <g stroke-linecap="round">
    <path d="M30 30 L84 84" stroke="url(#blade)" stroke-width="8"/>
    <path d="M98 30 L44 84" stroke="url(#blade)" stroke-width="8"/>
    <path d="M78 90 L90 78" stroke="url(#gold)" stroke-width="7"/>
    <path d="M38 78 L50 90" stroke="url(#gold)" stroke-width="7"/>
    <path d="M88 88 L98 98" stroke="#7a4a1a" stroke-width="7"/>
    <path d="M40 88 L30 98" stroke="#7a4a1a" stroke-width="7"/>
  </g>
  <!-- shield -->
  <path d="M64 30 L88 39 V60 C88 76 77 87 64 93 C51 87 40 76 40 60 V39 Z" fill="url(#gold)" stroke="#8a5a12" stroke-width="3"/>
  <path d="M64 38 L81 44.5 V60 C81 71 73.5 79.5 64 84.5 Z" fill="#fff" fill-opacity=".28"/>
  <!-- gear (automation) -->
  <g transform="translate(64 60)" fill="#1d3566">
    <circle r="9.5"/>
    <g>
      <rect x="-2.6" y="-14" width="5.2" height="6" rx="1"/>
      <rect x="-2.6" y="8" width="5.2" height="6" rx="1"/>
      <rect x="-14" y="-2.6" width="6" height="5.2" rx="1"/>
      <rect x="8" y="-2.6" width="6" height="5.2" rx="1"/>
    </g>
    <circle r="4" fill="#ffd25a"/>
  </g>
</svg>
