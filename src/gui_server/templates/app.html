<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoC Bot</title>
<link rel="icon" href="{{ url_for('static', filename='logo.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#0d1730; --bg2:#111e3d; --panel:#16264a; --panel2:#1b2e57; --line:#2a4173; --line2:#36528c;
  --text:#e8eefc; --muted:#93a6cc; --dim:#6c80a8;
  --accent:#4f9bff; --accent2:#7cb6ff; --gold:#ffc83d; --elixir:#e05cff; --dark:#9aa3b8;
  --ok:#2fcf7a; --warn:#ffb020; --bad:#ff5d6c;
  --radius:14px; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#1e3a75 0%,transparent 60%),var(--bg);color:var(--text);font-size:15px;display:flex;flex-direction:column;overflow:hidden}
body.ltr{direction:ltr}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:linear-gradient(180deg,#16284f,#121f40);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:220px}
.brand img{width:48px;height:48px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.5px}
.brand small{display:block;color:var(--muted);font-size:13px;margin-top:-2px}
.res-chips{display:flex;gap:10px;margin-inline-start:auto}
.chip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:150px}
.chip .ic{width:30px;height:30px;flex:none}
.chip label{display:block;color:var(--muted);font-size:12px;line-height:1.1}
.chip b{font-size:17px;font-weight:800}
.hbtn{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.hbtn:hover{border-color:var(--line2);background:var(--panel2)}
.acc-select{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 10px}
.acc-select select{background:transparent;border:0;outline:0;font-weight:700;padding:4px}
.acc-select option{background:var(--panel)}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 14px;font-weight:700;border:1px solid var(--line);background:var(--panel)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
.st-running .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(47,207,122,.18)}
.st-idle .dot{background:var(--accent)}
.st-paused .dot,.st-scheduled .dot,.st-break .dot,.st-limit .dot{background:var(--warn)}
.st-error .dot{background:var(--bad);box-shadow:0 0 0 4px rgba(255,93,108,.18)}

/* ---------- tabs ---------- */
body{padding-inline-start:236px}
nav.tabs{position:fixed;top:0;bottom:0;inset-inline-start:0;width:236px;display:flex;flex-direction:column;gap:4px;padding:14px 12px;background:linear-gradient(180deg,#121f40,#0c1630);border-inline-end:1px solid var(--line);overflow-y:auto;z-index:20}
nav.tabs .side-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;margin-bottom:6px;border-bottom:1px solid var(--line)}
nav.tabs .side-brand img{width:44px;height:44px}
nav.tabs .side-brand b{display:block;font-size:19px;font-weight:800}
nav.tabs .side-brand small{color:var(--muted);font-size:12px}
nav.tabs button{position:relative;display:flex;align-items:center;gap:12px;background:transparent;border:1px solid transparent;border-radius:12px;padding:10px 12px;color:var(--muted);cursor:pointer;font-weight:700;text-align:start;font-size:15px}
nav.tabs button i{font-size:17px;width:22px;text-align:center;color:var(--gold)}
nav.tabs button:hover{color:var(--text);background:var(--panel)}
nav.tabs button.active{color:#fff;background:linear-gradient(90deg,#3a3f8f,#2a3270);border-color:#5560c9;box-shadow:inset 3px 0 0 #8b93ff}
body:not(.ltr) nav.tabs button.active{box-shadow:inset -3px 0 0 #8b93ff}
nav.tabs button.soon{opacity:.45}
nav.tabs button .soon-tag{margin-inline-start:auto;font-size:10px;background:#2a3b62;border-radius:6px;padding:0 6px;color:var(--muted)}
nav.tabs .side-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-weight:700}
header .brand{display:none}
.sys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.sys .tile{background:#0f1b38;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;border-top:4px solid var(--c,var(--accent))}
.sys .tile span{display:block;color:var(--muted);font-size:12.5px;font-weight:700}
.sys .tile b{display:block;font-size:17px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.asec-hide{display:none !important}
@media (max-width:1100px){body{padding-inline-start:0}nav.tabs{position:static;width:auto;flex-direction:row;flex-wrap:wrap}nav.tabs .side-brand,nav.tabs .side-foot{display:none}.sys{grid-template-columns:repeat(3,1fr)}}
.subtabs{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px;margin-bottom:14px;width:max-content;max-width:100%;overflow-x:auto}
.subtabs button{background:transparent;border:0;border-radius:999px;padding:6px 18px;color:var(--muted);cursor:pointer;font-weight:700}
.subtabs button.active{background:var(--accent);color:#04122e}

/* ---------- main ---------- */
main{flex:1;overflow-y:auto;padding:16px 18px 24px}
.page{display:none}
.page.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.span2{grid-column:span 2}
@media (max-width:1100px){.grid,.grid.three{grid-template-columns:1fr}.span2{grid-column:auto}.res-chips .chip{min-width:110px}}
.card{background:linear-gradient(180deg,var(--panel),#142446);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 4px}
.card-h h3{margin:0;font-size:17px;font-weight:800}
.card-h .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);color:var(--gold);flex:none}
.card-h .tools{margin-inline-start:auto;display:flex;gap:8px}
.card-sub{color:var(--muted);font-size:13px;padding:0 16px 10px;border-bottom:1px solid var(--line)}
.card-b{padding:14px 16px}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed rgba(54,82,140,.45)}
.row:last-child{border-bottom:0}
.row .lbl{flex:1}
.row .lbl small{display:block;color:var(--muted);font-size:12.5px}
.note{color:var(--muted);font-size:12.5px;margin-top:8px}
.note i{color:var(--accent2)}
ul.feat{margin:6px 0 0;padding-inline-start:18px;color:var(--muted);font-size:13px;line-height:1.9}

/* ---------- controls ---------- */
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#2a3b62;border-radius:99px;transition:.15s;cursor:pointer;border:1px solid var(--line2)}
.sw span:before{content:"";position:absolute;width:20px;height:20px;top:2px;inset-inline-start:2px;background:#cfd9ef;border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--accent);border-color:var(--accent)}
.sw input:checked+span:before{inset-inline-start:22px;background:#fff}
input.in,select.in{background:#0f1b38;border:1px solid var(--line2);border-radius:10px;padding:7px 10px;outline:0;min-width:0}
input.in:focus,select.in:focus{border-color:var(--accent)}
input.in[type=number]{width:120px;text-align:center}
input.in.wide{width:100%}
.unit{color:var(--muted);font-size:13px;min-width:40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:9px 16px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.primary{background:linear-gradient(180deg,#6fb0ff,#3d86ea);border-color:#3d86ea;color:#04122e}
.btn.go{background:linear-gradient(180deg,#36d985,#1f9e5d);border-color:#1f9e5d;color:#03210f}
.btn.stop{background:linear-gradient(180deg,#ff7a86,#d8414f);border-color:#d8414f;color:#2b0006}
.btn.gold{background:linear-gradient(180deg,#ffd76a,#e0a526);border-color:#e0a526;color:#2b1a00}
.btn.ghost{background:transparent}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:#13244a;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;cursor:pointer}
.choice:hover{border-color:var(--accent)}
.choice .t{flex:1}
.choice .t b{display:block}
.choice .t small{color:var(--muted)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{cursor:pointer}
.days input{display:none}
.days span{display:inline-block;padding:6px 12px;border-radius:9px;border:1px solid var(--line2);background:#0f1b38;color:var(--muted);font-weight:700}
.days input:checked+span{background:var(--accent);border-color:var(--accent);color:#04122e}

/* ---------- priority editor ---------- */
.prio{display:flex;flex-direction:column;gap:10px}
.lvl{background:#0f1b38;border:1px solid var(--line2);border-radius:12px;padding:10px}
.lvl-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--muted);font-weight:700;font-size:13px}
.lvl-h .num-badge{background:var(--accent);color:#04122e;border-radius:8px;padding:0 9px;font-weight:800}
.lvl-h .tools{margin-inline-start:auto;display:flex;gap:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;background:#1d3463;border:1px solid var(--line2);border-radius:999px;padding:3px 6px 3px 12px;font-size:13.5px}
body:not(.ltr) .tag{padding:3px 12px 3px 6px}
.tag button{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:0 4px}
.tag button:hover{color:var(--bad)}
.add-tag{display:flex;gap:6px;margin-top:8px}
.add-tag input{flex:1}
.ibtn{background:#1d3463;border:1px solid var(--line2);border-radius:8px;width:30px;height:28px;cursor:pointer;color:var(--muted)}
.ibtn:hover{color:var(--text);border-color:var(--accent)}

/* ---------- stats / tables / log ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border-radius:12px;padding:10px 12px;background:#0f1b38;border:1px solid var(--line2)}
.stat.g{border-color:rgba(255,200,61,.55)} .stat.e{border-color:rgba(224,92,255,.55)} .stat.d{border-color:rgba(154,163,184,.55)}
.stat .h{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:700}
.stat .h .ic{width:20px;height:20px}
.stat .big{font-size:24px;font-weight:800;margin:2px 0}
.stat.g .big{color:var(--gold)} .stat.e .big{color:var(--elixir)} .stat.d .big{color:#c9d1e3}
.stat .sub{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px}
.kpis{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.kpi b{font-size:26px;font-weight:800;display:block;line-height:1.1}
.kpi span{color:var(--muted);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--muted);font-weight:700;text-align:start;padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#142446}
td{padding:8px;border-bottom:1px dashed rgba(54,82,140,.45)}
.tablewrap{max-height:280px;overflow:auto}
.c-g{color:var(--gold)} .c-e{color:var(--elixir)} .c-d{color:#c9d1e3}
.log{background:#09122a;border:1px solid var(--line2);border-radius:12px;height:420px;overflow:auto;padding:10px 12px;font-size:13.5px;line-height:1.75}
.log .ln{display:flex;gap:10px;border-bottom:1px solid rgba(42,65,115,.35);padding:2px 0}
.log .tm{color:var(--dim);flex:none;font-size:12px;direction:ltr}
.log .lv{flex:none;font-weight:800;font-size:12px;border-radius:6px;padding:0 6px;height:20px;margin-top:3px}
.lv.INFO{background:rgba(79,155,255,.15);color:var(--accent2)}
.lv.WARNING{background:rgba(255,176,32,.15);color:var(--warn)}
.lv.ERROR,.lv.CRITICAL{background:rgba(255,93,108,.15);color:var(--bad)}
.lv.DEBUG{background:rgba(147,166,204,.12);color:var(--muted)}
.log .msg{white-space:pre-wrap;word-break:break-word}
.log .orig{color:var(--dim);font-size:12px;direction:ltr;display:block}
.log .trace{color:#7f8fb3;font-size:12px;direction:ltr;white-space:pre;padding-inline-start:16px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.acc-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line2);border-radius:12px;background:#0f1b38;margin-bottom:10px}
.acc-row .name{font-weight:800;font-size:16px;flex:1}
.acc-row .name small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}

/* ---------- footer ---------- */
.banner{display:none;align-items:center;gap:10px;background:#3a2e10;border-top:1px solid #6b5216;color:#ffd77a;padding:9px 18px;font-weight:700}
.banner.show{display:flex}
footer{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#0f1a36;border-top:1px solid var(--line)}
footer .emu{display:flex;align-items:center;gap:8px;color:var(--muted)}
footer .mid{display:flex;gap:10px;margin-inline:auto}
footer .mid .btn{min-width:150px;padding:11px 18px;font-size:16px}

/* ---------- modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(5,10,25,.65);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50}
.modal-bg.show{display:flex}
.modal{width:min(820px,92vw);background:linear-gradient(180deg,#1b2f5a,#142446);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow)}
.modal-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:20px}
.modal-h .x{margin-inline-start:auto}
.modal-b{padding:16px 20px}
.modal-f{display:flex;gap:10px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.opt-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{position:relative;border:2px solid var(--line2);border-radius:14px;padding:16px;background:#13244a;cursor:pointer;min-height:130px;display:flex;gap:12px}
.opt.sel{border-color:var(--accent);background:#1b3466}
.opt .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.opt.sel .chk{background:var(--accent);border-color:var(--accent);color:#04122e}
.opt .t b{display:block;font-size:16px}
.opt .t small{color:var(--muted)}
.opt svg{margin-inline-start:auto;width:70px;height:70px;flex:none}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);background:#1d3463;border:1px solid var(--line2);border-radius:12px;padding:10px 18px;opacity:0;transition:.2s;z-index:60;font-weight:700;pointer-events:none;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{border-color:var(--bad);color:#ffc1c7}
.badge{position:absolute;top:4px;inset-inline-end:10px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;line-height:18px;display:none}
.badge.show{display:inline-block}
.errs{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 330px);overflow:auto}
.err{display:flex;gap:12px;background:#0f1b38;border:1px solid var(--line2);border-inline-start:4px solid var(--bad);border-radius:12px;padding:10px 12px}
.err.warning{border-inline-start-color:var(--warn)}
.err .body{flex:1;min-width:0}
.err .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.err .ttl{font-weight:800;font-size:15px;margin:3px 0}
.err .fix{color:#bfe3c9;font-size:13px}
.err .fix i{color:var(--ok)}
.err details{margin-top:4px;color:var(--dim);font-size:12px}
.err details pre{direction:ltr;text-align:left;white-space:pre-wrap;margin:4px 0 0;font-family:Consolas,monospace}
.err img{width:150px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line2);cursor:zoom-in;flex:none}
.tagp{background:#1d3463;border-radius:7px;padding:0 8px;font-weight:700}
#shotModal .modal{width:min(1100px,95vw)}
/* ---------- unit pictures ---------- */
.unit-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.unit-pick img{width:40px;height:40px;object-fit:contain;padding:3px;border-radius:9px;border:1px solid var(--line);background:#0b1530;cursor:pointer;opacity:.55}
.unit-pick img:hover{opacity:.9}
.unit-pick img.on{opacity:1;border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,155,255,.35)}
.unit-pick.big figure{margin:0;width:78px;text-align:center}
.unit-pick.big img{width:64px;height:64px;opacity:1;cursor:default}
.unit-pick.big figcaption{font-size:11px;color:var(--muted);line-height:1.2;margin-top:2px}
/* ---------- setup screen ---------- */
#setupModal{z-index:60;background:rgba(5,10,25,.88)}
#setupModal .modal{width:min(1000px,96vw);max-height:94vh;display:flex;flex-direction:column}
#setupModal .modal-b{overflow:auto}
.su-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.su-sum{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:#0f1b38;border:1px solid var(--line2);margin-bottom:12px;font-weight:700}
.su-sum.ok{border-color:rgba(47,207,122,.5)} .su-sum.bad{border-color:rgba(255,93,108,.5)}
.su-acc{background:#0f1b38;border:1px solid var(--line2);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.su-acc.ready{border-color:rgba(47,207,122,.55)}
.su-acc-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
.su-acc-h b{font-size:18px}
.su-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
@media (max-width:760px){.su-steps{grid-template-columns:repeat(2,1fr)}}
.su-step{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.su-step i{font-size:16px} .su-step small{display:block;color:var(--muted);font-size:11px}
.su-step.ok{border-color:rgba(47,207,122,.6);background:rgba(47,207,122,.08)} .su-step.bad{border-color:rgba(255,93,108,.6);background:rgba(255,93,108,.08)}
.su-step.ok i{color:var(--ok)} .su-step.bad i{color:var(--bad)} .su-step.wait i{color:var(--warn)}
.su-btns{display:flex;flex-wrap:wrap;gap:8px}
.su-hint{color:var(--warn);font-size:13px;margin-top:8px}
#shotModal img{width:100%;border-radius:10px;display:block}
.shot-wrap{position:relative;user-select:none;border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:#060c1c;min-height:200px;cursor:crosshair}
.shot-wrap img{display:block;width:100%}
.selbox{position:absolute;border:2px solid var(--gold);background:rgba(255,200,61,.18);pointer-events:none;display:none}
.selbox.old{border-color:var(--ok);background:rgba(47,207,122,.12);border-style:dashed}
.titem{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line2);border-radius:10px;background:#0f1b38;margin-bottom:8px;cursor:pointer}
.titem.cur{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,200,61,.25)}
.titem .nm{flex:1}
.titem .nm small{display:block;color:var(--muted);font-size:12px}
.titem img{height:30px;max-width:80px;border-radius:5px;border:1px solid var(--line2);background:#000}
.tgroup{color:var(--gold);font-weight:800;margin:10px 0 6px}
.step{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px dashed var(--line2);border-radius:9px;margin-bottom:6px;font-size:13.5px}
.step .k{flex:1}
.ok-dot{color:var(--ok)} .no-dot{color:var(--bad)}

/* =====================================================================
   Layout & look: dark charcoal, sidebar on the left, big page title,
   action buttons row, framed content, underline tabs, status bar
   ===================================================================== */
:root{
  --bg:#12141b; --bg2:#171a22; --panel:#1b1e28; --panel2:#232735; --line:#2c3140; --line2:#3a4052;
  --text:#e9ebf2; --muted:#9aa0b3; --dim:#6d7387; --accent:#8b7cf6; --accent2:#b0a4ff;
  --radius:10px; --shadow:none;
}
body{background:var(--bg);padding-inline-start:0 !important;padding-left:262px !important}
body.side-mini{padding-left:94px !important}
nav.tabs{left:10px !important;right:auto !important;top:10px;bottom:10px;width:240px;border-radius:16px;background:var(--panel);border:1px solid var(--line);padding:12px 10px}
body.side-mini nav.tabs{width:72px}
body.side-mini nav.tabs button span,body.side-mini nav.tabs .side-brand div,body.side-mini nav.tabs .soon-tag,body.side-mini nav.tabs .side-foot{display:none}
body.side-mini nav.tabs button{justify-content:center}
body.side-mini .side-collapse i{transform:rotate(180deg)}
.side-collapse{align-self:flex-end;width:40px;height:40px;border-radius:8px;border:0;background:var(--panel2);color:var(--text);cursor:pointer;margin-bottom:4px}
nav.tabs .side-brand{border-bottom:0;padding-bottom:6px}
nav.tabs button{flex-direction:row-reverse;justify-content:space-between;color:var(--text);border-radius:10px;padding:11px 14px;font-size:16px}
nav.tabs button span:not(.soon-tag):not(.badge){flex:1}
nav.tabs button i{font-size:20px}
nav.tabs button:hover{background:var(--panel2)}
nav.tabs button.active,body:not(.ltr) nav.tabs button.active{background:#3a3462;border-color:transparent;box-shadow:inset 4px 0 0 var(--accent2)}
header{background:transparent;border:0;padding:18px 22px 6px}
.acc-chip{display:flex;align-items:center;gap:14px;order:2;margin-inline-start:auto}
.acc-chip .av{width:60px;height:60px;border-radius:10px;background:#2e2a52;border:1px solid var(--line2);display:grid;place-items:center;font-weight:800;font-size:20px}
.acc-chip .who select{background:transparent;border:0;color:var(--text);font-weight:800;font-size:17px;outline:0;padding:0}
.acc-chip .who select option{background:var(--panel)}
.acc-chip .who small{display:block;color:var(--muted);font-size:13px}
.page-title{margin:0;font-size:34px;font-weight:800;order:1}
.actions{display:flex;align-items:center;gap:10px;padding:4px 22px 12px;flex-wrap:wrap}
.actions .grow{flex:1}
.abtn{display:inline-flex;align-items:center;gap:10px;min-width:140px;justify-content:center;padding:11px 18px;background:var(--panel);border:1px solid #7b8196;border-radius:4px;color:var(--text);font-weight:700;font-size:16px;cursor:pointer}
.abtn:hover{background:var(--panel2)}
.abtn:disabled{opacity:.45;cursor:not-allowed}
.abtn.go{background:#2aa255;border:2px solid #4fd17d;color:#fff;min-width:180px}
.abtn.go i{color:#fff}
main{margin:0 22px 8px 0;padding:14px;border:2px solid #c9ccd6;border-radius:4px;background:var(--bg2)}
.statusbar{display:flex;align-items:center;gap:14px;margin:0 22px 10px 0;padding:6px 14px;border:1px solid var(--line2);border-radius:4px;background:var(--bg2);color:var(--muted);font-size:14px}
.statusbar .pill{border:0;background:transparent;padding:0;color:var(--text)}
.statusbar .grow{flex:1}
.statusbar .sep{color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.card-h .ico{background:transparent}
.card-sub{border-bottom:1px solid var(--line)}
.row{border-bottom:1px dashed rgba(90,96,120,.35)}
.subtabs{background:var(--panel);border-radius:0;border:0;border-bottom:1px solid var(--line2);padding:0;gap:0;width:max-content}
.subtabs button{border-radius:0;padding:12px 26px;color:var(--text);font-weight:600;border-bottom:3px solid transparent}
.subtabs button.active{background:transparent;color:var(--text);border-bottom-color:var(--accent2)}
.panel{border:1px solid var(--line2);border-radius:6px;padding:12px;background:var(--panel);margin-bottom:12px}
.panel-t{font-size:16px;margin-bottom:10px}
.sys .tile{background:var(--panel2);border-color:var(--line);border-radius:4px}
.quick .btn{background:transparent;border:1px solid #7b8196;border-radius:4px;min-width:150px}
.home-accs{display:flex;flex-wrap:wrap;gap:10px}
.hacc{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);cursor:pointer;min-width:220px}
.hacc.cur{border-color:var(--accent)}
.hacc .av{width:38px;height:38px;border-radius:8px;background:#2e2a52;display:grid;place-items:center;font-weight:800}
.hacc .nm{flex:1} .hacc .nm small{display:block;color:var(--muted);font-size:12px}
.home-split{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.srow{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel2);border-radius:6px;margin-bottom:8px;font-weight:700}
.srow .ic{width:24px;height:24px}
.srow b{margin-inline-start:auto;font-size:18px}
.log{background:#0d0f14;border-color:var(--line)}
.log.term{background:#000;font-family:Consolas,"Courier New",monospace;font-size:13px}
input.in,select.in{background:#14161d;border-color:var(--line2);border-radius:4px}
.lvl,.acc-row,.stat,.choice,.titem{background:var(--panel2)}
.modal{background:var(--panel)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
::-webkit-scrollbar-thumb{background:#3a4052}
.opt{background:var(--panel2) !important;border-color:var(--line2) !important}
.opt.sel,.opt.selbox{background:#2e2a52 !important;border-color:var(--accent) !important}
.su-acc,.su-sum{background:var(--panel2)}
.tag,.ibtn{background:#2a2e3d}
th{background:var(--panel)}
@media (max-width:900px){body,body.side-mini{padding-left:0 !important}nav.tabs{position:static;width:auto;border-radius:0}main,.statusbar{margin:0 8px 8px}.home-split{grid-template-columns:1fr}.abtn{min-width:0}}
</style>
</head>

/* =====================================================================
   State
   ===================================================================== */
let LANG = "ar";
let S = null, savedS = "";          // account settings (edited copy + saved json)
let APP = null, savedAPP = "";      // app settings
let STATE = {accounts:[], current_time:Date.now()/1000};
let CUR = null;                     // current account id
let STATS = null, LOG = [];
let VOCAB = {};
let curTab = "dash", curSub = "walls";
let wallPick = "multiple";

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const t = k => (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;
const fmt = n => (n === null || n === undefined || isNaN(n)) ? "—" : Number(n).toLocaleString("en-US");

async function api(url, opts){
  const o = opts || {};
  if (o.body && typeof o.body !== "string") { o.body = JSON.stringify(o.body); o.headers = {"Content-Type":"application/json"}; }
  const r = await fetch(url, o);
  return r.json();
}
function toast(msg, err){
  const el = $("#toast"); el.textContent = msg; el.className = "show" + (err ? " err" : "");
  clearTimeout(el._t); el._t = setTimeout(() => el.className = "", 2600);
}
function getPath(obj, path){ return path.split(".").reduce((o,k) => o == null ? o : o[k], obj); }
function setPath(obj, path, val){ const ks = path.split("."); const last = ks.pop(); ks.reduce((o,k) => o[k], obj)[last] = val; }

/* =====================================================================
   i18n
   ===================================================================== */
function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  document.body.classList.toggle("ltr", LANG !== "ar");
  $$("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  $$("[data-tph]").forEach(el => el.placeholder = t(el.dataset.tph));
  $$(".flip").forEach(el => el.className = "fa-solid flip " + (LANG === "ar" ? "fa-chevron-left" : "fa-chevron-right"));
  buildDays(); buildQuickTasks(); renderPrio(); updateWallLabel(); renderPresets();
  $("#pageTitle").textContent = t("sub_" + curTab);
  renderState(); renderStats(); renderLog(); updateSchedNote();
}
function setLang(v){ LANG = v; applyLang(); markDirty(); }

/* =====================================================================
   Tabs
   ===================================================================== */
const SET_GROUP = ["set", "sch"];
function showTab(name){
  if (name === "err") name = "log";
  curTab = name;
  const inSet = SET_GROUP.includes(name);
  $$("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === (inSet ? "set" : name)));
  $("#setNav").style.display = inSet ? "" : "none";
  $$("#setNav button").forEach(b => b.classList.toggle("active", b.dataset.sub === name));
  $$(".page").forEach(p => p.classList.toggle("active", p.id === "p-" + name));
  $("#pageTitle").textContent = t("sub_" + name);
  try { localStorage.setItem("tab", name); } catch(e) {}
  if (name === "res") { loadStats(); loadLog(); }
  if (name === "log") { loadErrors(); loadLog(); }
  if (name === "set") checkTess();
  if (name === "teach") loadTeach();
}
function showSub(name){
  curSub = name;
  $$("#upgSub button").forEach(b => b.classList.toggle("active", b.dataset.sub === name));
  $$("#p-upg .sub").forEach(s => s.style.display = s.dataset.sub === name ? "" : "none");
}
$$("#tabs button").forEach(b => b.onclick = () => b.dataset.soon ? toast(t("soon_msg")) : showTab(b.dataset.tab));
/* setup screen */
let SU = null, suTimer = null, suBusy = false;
function suFillDisp(){ $("#suW").value = APP.display_w || 1920; $("#suH").value = APP.display_h || 1080; $("#suD").value = APP.display_dpi || 240;
  $("#suDispWarn").style.display = (+$("#suW").value === 1920 && +$("#suH").value === 1080) ? "none" : ""; }
function suDefaultDisp(){ $("#suW").value = 1920; $("#suH").value = 1080; $("#suD").value = 240; suFillWarn(); }
function suFillWarn(){ $("#suDispWarn").style.display = (+$("#suW").value === 1920 && +$("#suH").value === 1080) ? "none" : ""; }
async function suSaveDisp(){
  const w = parseInt($("#suW").value), h = parseInt($("#suH").value), d = parseInt($("#suD").value);
  if (!(w > 200 && h > 200 && d > 60)) { toast(t("su_disp_bad"), true); return false; }
  if (APP.display_w !== w || APP.display_h !== h || APP.display_dpi !== d) {
    APP.display_w = w; APP.display_h = h; APP.display_dpi = d;
    APP = await api("/api/app_settings", {method:"POST", body:APP}); delete APP.platform; delete APP.warning; savedAPP = JSON.stringify(APP);
  }
  return true;
}
async function suAutoAll(){
  if (!SU || !SU.accounts.length) return;
  if (!(await suSaveDisp())) return;
  if (!confirm(t("su_auto_confirm").replace("{s}", `${APP.display_w}×${APP.display_h} · ${APP.display_dpi} DPI`))) return;
  for (const a of SU.accounts) await api("/api/setup/auto", {method:"POST", body:{account:a.id}});
  toast(t("su_auto_started")); loadSetup();
}
function openSetup(){ $("#setupModal").classList.add("show"); $("#suEmu").value = APP.emulator; $("#suLdPath").value = APP.ldplayer_path || ""; suFillDisp();
  ["#suW", "#suH"].forEach(s => $(s).oninput = suFillWarn);
  $("#suShow").checked = APP.show_setup !== false; loadSetup(); clearInterval(suTimer); suTimer = setInterval(loadSetup, 5000); }
async function closeSetup(){
  clearInterval(suTimer); $("#setupModal").classList.remove("show");
  const show = $("#suShow").checked;
  if (APP.show_setup !== show) { APP.show_setup = show; await api("/api/app_settings", {method:"POST", body:APP}); savedAPP = JSON.stringify(APP); }
}
async function suSaveEmu(){
  APP.emulator = $("#suEmu").value; APP.ldplayer_path = $("#suLdPath").value.trim();
  APP = await api("/api/app_settings", {method:"POST", body:APP}); delete APP.platform; delete APP.warning; savedAPP = JSON.stringify(APP);
  fillInputs(); toast(t("saved")); loadSetup();
}
async function loadSetup(){
  if (suBusy) return; suBusy = true;
  $("#suLdPath").style.display = $("#suEmu").value === "ldplayer" ? "" : "none";
  try { SU = await api("/api/setup/status"); } catch(e) { suBusy = false; return; }
  suBusy = false; renderSetup();
}
function suReady(a){ return a.emu_running && a.adb === "device" && a.res_ok !== false && a.game; }
function renderSetup(){
  if (!SU) return;
  const emuName = {ldplayer:"LDPlayer", bluestacks:"BlueStacks", mumu:"MuMu"}[SU.emulator] || SU.emulator;
  const sum = $("#suSum");
  if (!SU.found) { sum.className = "su-sum bad"; sum.innerHTML = `<i class="fa-solid fa-circle-xmark" style="color:var(--bad)"></i> ${t("su_not_found").replace("{e}", emuName)}`; }
  else {
    const ready = SU.accounts.filter(suReady).length;
    sum.className = "su-sum " + (ready === SU.accounts.length && ready ? "ok" : "");
    const copies = SU.emulator === "mumu" ? "" : ` · ${t("su_copies")}: <b class="num">${SU.copies.length}</b> ${SU.copies.length ? "(" + SU.copies.map(c => esc(c.title) + (c.running ? " 🟢" : "")).join("، ") + ")" : ""}`;
    sum.innerHTML = `<i class="fa-solid fa-circle-check" style="color:var(--ok)"></i> ${emuName}${copies} · ${t("su_accounts")}: <b class="num">${SU.accounts.length}</b> · ${t("su_ready")}: <b class="num">${ready}</b>`;
  }
  const copyOpts = (sel) => `<option value="">${t("su_auto")}</option>` + SU.copies.map(c => `<option value="${esc(String(c.index))}" ${String(sel) === String(c.index) ? "selected" : ""}>${esc(c.title)}</option>`).join("");
  $("#suNewCopy").innerHTML = copyOpts("");
  $("#suNewCopy").style.display = SU.copies.length ? "" : "none";
  const step = (ok, icon, label, info) => `<div class="su-step ${ok === true ? "ok" : ok === false ? "bad" : "wait"}"><i class="fa-solid ${ok === true ? "fa-circle-check" : ok === false ? "fa-circle-xmark" : "fa-circle-minus"}"></i><div>${label}<small>${info || ""}</small></div></div>`;
  const links = APP.emulator_links || {};
  $("#suAccs").innerHTML = SU.accounts.map(a => {
    const ready = suReady(a);
    let hint = "";

function inSchedule(now){
  const sc = S.schedule; if (!sc.enabled) return true;
  const m = s => { const [h, mi] = (s || "0:0").split(":").map(Number); return h * 60 + mi; };
  const cur = now.getHours() * 60 + now.getMinutes(), a = m(sc.start), b = m(sc.end);

}

  try { VOCAB = await api("/api/vocab"); } catch(e) {}
  STATE = await api("/api/state");
  let saved = null; try { saved = localStorage.getItem("acc"); } catch(e) {}
  const running = STATE.accounts.find(a => a.running);
  CUR = (saved && APP.accounts.includes(saved)) ? saved : (running ? running.id : APP.accounts[0]);
  await loadSettings();
  let tab = "dash"; try { tab = localStorage.getItem("tab") || "dash"; } catch(e) {}
  showTab(tab); showSub("walls");
  applyLang();
  loadStats(); loadLog();
  setInterval(loadState, 3000);
  loadSystem(); setInterval(() => { if (curTab === "dash") loadSystem(); }, 3000);
  showAtk("plans"); loadRecordings(); loadUnits();
  if (APP.show_setup !== false) openSetup();
  setInterval(() => { loadStats(); loadLog(); if (curTab === "err") loadErrors(); updateSchedNote(); }, 5000);
})();
</script>
</body>
